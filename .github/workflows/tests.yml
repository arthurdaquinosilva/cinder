name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install tmux (for the real-terminal test)
        run: ${{ runner.os == 'Linux' && 'sudo apt-get install -y tmux' || 'brew install tmux' }}
      - run: npm ci
      - name: Syntax check
        run: for f in bin/*.js src/*.js src/magics/*.js scripts/*.js; do node --check "$f"; done
      - run: npm test
      - name: Docs are up to date
        run: npm run docs:check
